  namespace: Virtufin.Api.Services
  summary: The process-wide gRPC channel to the local Dapr sidecar.
  remarks: >-
    Registered as a singleton so every component talking to the sidecar shares one

    connection. Distinct from <xref href="Virtufin.Api.Services.GrpcChannelPool" data-throw-if-not-resolved="false"></xref>, which manages channels to

    downstream *application* services across many hosts; this is a single fixed

    localhost target and needs no pooling or health validation.
