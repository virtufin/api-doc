  source:
    remote:
      path: src/Virtufin.Api/Services/AppMetrics.cs
      branch: master
      repo: https://git.haenerconsulting.com/virtufin/virtufin-api
    id: StateChangePublishFailures
    path: ../../../src/Virtufin.Api/Services/AppMetrics.cs
    startLine: 69
  assemblies:
  - Virtufin.Api
  namespace: Virtufin.Api.Services
  summary: >-
    State-change notifications that failed to publish <b>after</b> the state write

    had already succeeded — i.e. events silently lost.
  remarks: >-
    <p>

    Publication is at-most-once and not atomic with the write (see the State Change

    Events requirement in the pubsub-topics spec). When this fires, the write stands

    and no subscriber is told: there is no retry, no dead letter, and the caller sees

    success — correctly, since failing the call would make them repeat a write that

    landed.

    </p>

    <p>

    This counter exists to answer whether that gap needs closing. Closing it means a

    transactional outbox, which flips the guarantee to at-least-once and makes every

    subscriber's idempotency a breaking concern — worth it for a daily failure, not

    obviously worth it for a twice-a-year one. Nobody currently knows which this is.

    </p>
  example: []
  syntax:
    content: public static readonly Counter<long> StateChangePublishFailures
    return:
      type: System.Diagnostics.Metrics.Counter{System.Int64}
    content.vb: Public Shared ReadOnly StateChangePublishFailures As Counter(Of Long)
