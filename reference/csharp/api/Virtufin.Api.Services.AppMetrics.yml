  assemblies:
  - Virtufin.Api
  namespace: Virtufin.Api.Services
  summary: Application-level metrics for the API gateway.
  remarks: >-
    <p>

    <code>Program.cs</code> has registered <code>AddMeter("Virtufin.Api")</code> since OpenTelemetry

    was wired up, but nothing ever created that meter — the pipeline was configured and

    empty. This is the type that gives it something to export.

    </p>

    <p>

    The meter name must stay in step with the <code>AddMeter</code> call; <xref href="Virtufin.Api.Services.AppMetrics.MeterName" data-throw-if-not-resolved="false"></xref>

    is referenced there so the two cannot drift.

    </p>
  example: []
  syntax:
