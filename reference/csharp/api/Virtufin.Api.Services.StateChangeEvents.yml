  - Virtufin.Api
  namespace: Virtufin.Api.Services
  summary: CloudEvent attributes for the Tier 0 <code>state.change</code> topic.
  remarks: >-
    Per the pubsub-topics spec, a Tier 0 <code>ce-type</code> is

    <code>com.virtufin.&lt;service&gt;.&lt;category&gt;.&lt;event&gt;</code> and <code>ce-source</code> is the

    publishing service's URN. These were <code>com.dapr.event.sent</code> and

    <code>urn:apigateway</code>: the same type for saves and deletes, so it discriminated

    nothing and every subscriber had to parse the payload to learn which had happened.
