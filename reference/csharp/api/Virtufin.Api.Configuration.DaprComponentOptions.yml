  namespace: Virtufin.Api.Configuration
  summary: >-
    Resolves the pub/sub component name. Precedence: the explicit

    <code>PubsubName</code> setting, then the value services.json agrees on, then the default.
  example: []
  syntax:
    content: public static DaprComponentOptions Resolve(string? explicitName, ServicesConfiguration config)
