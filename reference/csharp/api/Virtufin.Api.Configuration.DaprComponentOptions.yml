  overload: Virtufin.Api.Configuration.DaprComponentOptions.Resolve*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: >-
      Thrown when registered services declare different <code>pubsub.pubsubName</code> values.

      Only one can be honoured, and silently picking one would reintroduce exactly the

      "configured but ignored" behaviour this replaces.
