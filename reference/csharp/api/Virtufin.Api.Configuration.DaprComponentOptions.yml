  assemblies:
  - Virtufin.Api
  namespace: Virtufin.Api.Configuration
  summary: >-
    The Dapr component names the gateway talks to. Resolved once at startup and injected,

    rather than hard-coded at each call site.
  remarks: >-
    <p>

    Two knobs for the pub/sub component name existed and neither was read: the

    <code>--pubsub-name</code> / <code>PubsubName</code> setting, and the per-service

    <code>pubsub.pubsubName</code> field in services.json (which helm emits from

    <code>.Values.pubsub.name</code>). Publishing and subscribing used the literal

    <code>"pubsub"</code>, so renaming the component in helm produced a deployment that

    looked configured and could not publish.

    </p>

    <p>

    The per-service field cannot be honoured per service: <code>Pubsub.PublishEvent</code> and

    <code>Pubsub.Subscribe</code> take a topic and no service, so there is nothing to resolve

    against at call time. It is therefore treated as a gateway-wide setting that every

    entry must agree on — which is how it is actually produced, since helm renders one

    value into every entry.

    </p>
  example: []
  syntax:
    content: public sealed class DaprComponentOptions
    content.vb: Public NotInheritable Class DaprComponentOptions
