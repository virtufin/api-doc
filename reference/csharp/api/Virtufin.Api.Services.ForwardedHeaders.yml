  assemblies:
  - Virtufin.Api
  namespace: Virtufin.Api.Services
  summary: >-
    Projects a caller-supplied metadata map (the HTTP <code>POST /v1/grpc/call</code> body's

    <code>metadata</code> field) to the subset safe to forward.
  remarks: >-
    These values come from a request body rather than transport metadata, so a caller

    can set any of them freely. That is acceptable for exactly this allow-list —

    tracing and correlation identifiers, which a REST caller has no other way to

    propagate, and which carry no authority. Do not widen it to anything a backend

    would trust for authentication or authorization.
  example: []
  syntax:
    content: public static Dictionary<string, string>? From(IReadOnlyDictionary<string, string>? metadata)
    parameters:
    - id: metadata
      type: System.Collections.Generic.IReadOnlyDictionary{System.String,System.String}
    return:
      type: System.Collections.Generic.Dictionary{System.String,System.String}
    content.vb: Public Shared Function From(metadata As IReadOnlyDictionary(Of String, String)) As Dictionary(Of String, String)
