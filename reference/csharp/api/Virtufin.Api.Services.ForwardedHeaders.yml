  assemblies:
  - Virtufin.Api
  namespace: Virtufin.Api.Services
  summary: Projects inbound gRPC request headers to the subset safe to forward.
  remarks: >-
    Binary (<code>-bin</code>) entries are skipped rather than read: <xref href="Grpc.Core.Metadata.Entry.Value" data-throw-if-not-resolved="false"></xref>

    throws <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref> on a binary entry, and

    <code>Metadata.Add(key, string)</code> throws <xref href="System.ArgumentException" data-throw-if-not-resolved="false"></xref> for a

    <code>-bin</code> key. Reading them unconditionally meant any client sending one got an

    opaque INTERNAL error and could never use Invoke at all.
  example: []
  syntax:
    content: public static Dictionary<string, string> From(Metadata headers)
    parameters:
    - id: headers
      type: Grpc.Core.Metadata
    return:
      type: System.Collections.Generic.Dictionary{System.String,System.String}
    content.vb: Public Shared Function From(headers As Metadata) As Dictionary(Of String, String)
  overload: Virtufin.Api.Services.ForwardedHeaders.From*
