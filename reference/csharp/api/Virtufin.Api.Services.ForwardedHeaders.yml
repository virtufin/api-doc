  assemblies:
  - Virtufin.Api
  namespace: Virtufin.Api.Services
  summary: >-
    The allow-list of request headers the gateway propagates to a backend on a proxied

    call, and the filters that apply it.
  remarks: >-
    <p>

    An allow-list on purpose. <code>Gateway.Invoke</code>/<code>InvokeJson</code> used to snapshot

    every inbound header and replay it downstream, which handed the gateway's own

    <code>x-api-key</code> — the credential guarding the ingress — to every backend on every

    proxied call, crossing the trust boundary that key exists to defend. Backends

    authenticate to the gateway with their own key and must never receive the caller's.

    </p>

    <p>

    Shared by the gRPC and HTTP entry points so the two cannot drift: the gRPC path

    forwarded everything while its <code>POST /v1/grpc/call</code> twin forwarded nothing at all,

    silently ignoring the <code>metadata</code> field callers were passing it.

    </p>
  example: []
  syntax:
    content: public static class ForwardedHeaders
    content.vb: Public Module ForwardedHeaders
