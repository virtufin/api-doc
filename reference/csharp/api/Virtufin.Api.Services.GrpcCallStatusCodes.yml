    path: ../../../src/Virtufin.Api/Services/Constants.cs
    startLine: 30
  assemblies:
  - Virtufin.Api
  namespace: Virtufin.Api.Services
  summary: >-
    The status vocabulary <code>Gateway.Invoke</code> / <code>InvokeJson</code> report in

    <code>InvokeResponse.status</code>.


    <p>

    Every status the gateway emits MUST come from here. A downstream

    <xref href="Grpc.Core.RpcException" data-throw-if-not-resolved="false"></xref> used to be reported as

    <code>ex.StatusCode.ToString()</code>, which is the PascalCase enum name

    (<code>"NotFound"</code>) — so the same condition reached clients as

    <code>NOT_FOUND</code> when the gateway detected it and <code>NotFound</code> when the

    backend did. Use <code>GrpcStatusCodeMap.ToGatewayStatus</code> to translate.

    </p>
