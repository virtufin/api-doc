  assemblies:
  - Virtufin.Api
  namespace: Virtufin.Api.Services
  summary: >-
    Statuses that indicate the <b>backend or the transport</b> is unhealthy, as

    opposed to the caller having asked for something wrong. Only these should

    count towards opening the gateway circuit breaker — a client looping on a

    bad method name must not break the circuit for everyone else.
  example: []
